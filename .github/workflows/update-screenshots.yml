name: Update Roborazzi Screenshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to record baselines from"
        required: false
        default: ""

# Recording baselines is a manual, maintainer-driven operation.
permissions:
  contents: read

concurrency:
  group: update-screenshots
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  record:
    name: Record Linux Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record Roborazzi baselines on Linux
        run: ./gradlew recordRoborazziDebug

      - name: Upload recorded baselines
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-baselines-linux
          path: |
            **/build/outputs/roborazzi/**
            **/src/test/screenshots/**
          retention-days: 14

      - name: How to commit the new baselines
        run: |
          {
            echo "## Linux Roborazzi baselines recorded"
            echo ""
            echo "1. Download the \`roborazzi-baselines-linux\` artifact from this run."
            echo "2. Copy the PNG baselines over the committed screenshots in the repository."
            echo "3. Run \`./gradlew verifyRoborazziDebug\` locally to confirm."
            echo "4. Commit the refreshed baselines on your branch."
          } >> "$GITHUB_STEP_SUMMARY"
