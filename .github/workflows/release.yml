name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (NDK + CMake)
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full verification gate
        run: ./gradlew spotlessCheck detekt testDebugUnitTest

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: Decode keystore if secrets are configured
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secrets configured; publishing unsigned release builds." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage APKs and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp wear/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cd dist
          sha256sum ./*.apk > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/checksums.txt
          body: |
            ${{ steps.keystore.outputs.signed == 'true' && 'Signed release APKs.' || '**Unsigned** release APKs (no keystore secrets configured on this repository yet).' }}
          fail_on_unmatched_files: false
