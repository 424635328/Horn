name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Minimal top-level permissions; jobs never write to the repository.
permissions:
  contents: read

# PRs and branch pushes cancel superseded runs; main never cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Impact analysis: map the change set to the smallest safe set of checks.
  # Unknown blast radius (build config, workflows, toolchains) escalates to the
  # full battery; docs-only change sets stay cheap. Weekly full coverage is the
  # backstop (see full-suite.yml).
  changes:
    name: Impact analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.map.outputs.mode }}
      gradle_args: ${{ steps.map.outputs.gradle_args }}
      needs_release: ${{ steps.map.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the impact mapper (positive + negative controls)
        run: python3 .github/scripts/impact_map.py --self-test

      - name: Collect changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/changed.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
            else
              git diff --name-only "$BEFORE" HEAD > /tmp/changed.txt
            fi
          fi
          echo "Changed files:"; cat /tmp/changed.txt

      - name: Map change set to impact scope
        id: map
        run: python3 .github/scripts/impact_map.py /tmp/changed.txt

  checks:
    name: Incremental checks (${{ needs.changes.outputs.mode }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run scoped quality gates
        run: ./gradlew ${{ needs.changes.outputs.gradle_args }}

      - name: Docs link integrity
        run: python3 .github/scripts/check_docs_links.py

      - name: Vendored skills integrity
        run: |
          python3 .github/scripts/check_skills.py --self-test
          python3 .github/scripts/check_skills.py

      - name: Upload reports and visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/tests/**
            **/build/outputs/roborazzi/**
            **/build/reports/roborazzi/**
          retention-days: 7

  # Only runs when the change set can affect release artifacts (audio engine,
  # app/wear sources, build tooling). The weekly full suite always covers it.
  release-build-and-size:
    name: Release R8 Build & APK Size Report
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.needs_release == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (R8 + resource shrinking + Oboe NDK)
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: APK size report
        run: |
          {
            echo "## Release APK size report"
            echo ""
            echo "| Artifact | Size (bytes) | Size (KB) |"
            echo "|---|---:|---:|"
            for apk in app/build/outputs/apk/release/*.release.apk wear/build/outputs/apk/release/*.release.apk; do
              if [ -f "$apk" ]; then
                bytes=$(stat -c%s "$apk")
                kb=$(awk "BEGIN {printf \"%.1f\", $bytes/1024}")
                echo "| \`$apk\` | $bytes | $kb |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          retention-days: 5

  # Single required status check for branch protection. A skipped
  # release-build job means the change set did not need it (backstopped by the
  # weekly full suite), which is a pass.
  ci-gate:
    name: ci-gate
    needs: [changes, checks, release-build-and-size]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.checks.result }}"; do
            if [ "$r" != "success" ]; then
              echo "A required job finished with: $r"
              exit 1
            fi
          done
          case "${{ needs.release-build-and-size.result }}" in
            success|skipped) echo "release build: ${{ needs.release-build-and-size.result }}" ;;
            *) echo "release build finished with: ${{ needs.release-build-and-size.result }}"; exit 1 ;;
          esac
          echo "All gates green."
