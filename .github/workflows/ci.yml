name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Minimal top-level permissions; jobs never write to the repository.
permissions:
  contents: read

# PRs and branch pushes cancel superseded runs; main never cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  static-analysis:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless + Detekt + Android Lint
        run: ./gradlew spotlessCheck detekt lintDebug

      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          retention-days: 7

  unit-and-arch-tests:
    name: Unit & Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: All-module unit tests (DSP, Konsist, ViewModel, Wear)
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Roborazzi baselines
        run: ./gradlew verifyRoborazziDebug

      - name: Report mismatch guidance
        if: failure()
        run: |
          {
            echo "## Roborazzi visual regression failed"
            echo ""
            echo "The rendered UI no longer matches the committed baselines."
            echo "If the change is intentional, refresh the Linux baselines by manually"
            echo "running the \`update-screenshots.yml\` workflow and commit the result."
            echo "Diff images are attached to this run as the \`roborazzi-diffs\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/roborazzi/**
          retention-days: 7

  release-build-and-size:
    name: Release R8 Build & APK Size Report
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (R8 + resource shrinking + Oboe NDK)
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: APK size report
        run: |
          {
            echo "## Release APK size report"
            echo ""
            echo "| Artifact | Size (bytes) | Size (KB) |"
            echo "|---|---:|---:|"
            for apk in app/build/outputs/apk/release/*.release.apk wear/build/outputs/apk/release/*.release.apk; do
              if [ -f "$apk" ]; then
                bytes=$(stat -c%s "$apk")
                kb=$(awk "BEGIN {printf \"%.1f\", $bytes/1024}")
                echo "| \`$apk\` | $bytes | $kb |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          retention-days: 5

  docs-integrity:
    name: Docs Link Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check relative links and referenced source paths
        run: |
          python .github/scripts/check_docs_links.py

  # Single required status check for branch protection: aggregates every gate above.
  ci-gate:
    name: ci-gate
    needs: [static-analysis, unit-and-arch-tests, visual-regression, release-build-and-size, docs-integrity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        run: |
          results=("${{ needs.static-analysis.result }}" \
                   "${{ needs.unit-and-arch-tests.result }}" \
                   "${{ needs.visual-regression.result }}" \
                   "${{ needs.release-build-and-size.result }}" \
                   "${{ needs.docs-integrity.result }}")
          for r in "${results[@]}"; do
            if [ "$r" != "success" ]; then
              echo "A required job finished with: $r"
              exit 1
            fi
          done
          echo "All gates green."
