name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Minimal top-level permissions; jobs never write to the repository.
permissions:
  contents: read

# PRs and branch pushes cancel superseded runs; main never cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Merged verification gate: static analysis + unit/arch tests + visual regression +
  # docs integrity share ONE Gradle invocation so compilation happens exactly once.
  # The same surface is available locally as `./gradlew checkAll` (see CONTRIBUTING.md).
  checks:
    name: Checks (static analysis · tests · visual · docs)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: All quality gates in one invocation
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest verifyRoborazziDebug

      - name: Docs link integrity
        run: python3 .github/scripts/check_docs_links.py

      - name: Upload reports and visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/tests/**
            **/build/outputs/roborazzi/**
            **/build/reports/roborazzi/**
          retention-days: 7

  # The only job that needs the NDK: it proves the Oboe C++ engine and R8 release
  # pipeline stay green, and publishes the APK size budget to the step summary.
  release-build-and-size:
    name: Release R8 Build & APK Size Report
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (R8 + resource shrinking + Oboe NDK)
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: APK size report
        run: |
          {
            echo "## Release APK size report"
            echo ""
            echo "| Artifact | Size (bytes) | Size (KB) |"
            echo "|---|---:|---:|"
            for apk in app/build/outputs/apk/release/*.release.apk wear/build/outputs/apk/release/*.release.apk; do
              if [ -f "$apk" ]; then
                bytes=$(stat -c%s "$apk")
                kb=$(awk "BEGIN {printf \"%.1f\", $bytes/1024}")
                echo "| \`$apk\` | $bytes | $kb |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          retention-days: 5

  # Single required status check for branch protection: aggregates every gate above.
  ci-gate:
    name: ci-gate
    needs: [checks, release-build-and-size]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        run: |
          for r in "${{ needs.checks.result }}" "${{ needs.release-build-and-size.result }}"; do
            if [ "$r" != "success" ]; then
              echo "A required job finished with: $r"
              exit 1
            fi
          done
          echo "All gates green."
