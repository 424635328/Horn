config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 50
  NestedBlockDepth:
    threshold: 8
  CognitiveComplexMethod:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  ForbiddenComment:
    active: false
  UnusedPrivateProperty:
    active: false
  UseCheckOrError:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

naming:
  FunctionNaming:
    active: false
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  InstanceOfCheckForException:
    active: false
